name: Build tagged revision

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build CLI and validate core
        run: |
          mkdir -p zig-out/bin
          zig build-exe src/main.zig -femit-bin=zig-out/bin/odm
          zig test src/core/root.zig
          zig test src/protocols/http/download.zig
          python3 tests/integration/http_cli.py zig-out/bin/odm

      - name: Retain tagged CLI build
        uses: actions/upload-artifact@v4
        with:
          name: odm-linux-x86_64-${{ github.ref_name }}
          path: zig-out/bin/odm
          if-no-files-found: error
