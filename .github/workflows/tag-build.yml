name: Build tagged revision

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: zig-out/bin/speed-download
            artifact: speed-download-linux-x86_64
          - os: windows-latest
            binary: zig-out/bin/speed-download.exe
            artifact: speed-download-windows-x86_64
          - os: macos-latest
            binary: zig-out/bin/speed-download
            artifact: speed-download-macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build CLI and validate core
        shell: bash
        run: |
          mkdir -p zig-out/bin
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            zig build-exe src/main.zig -femit-bin=${{ matrix.binary }}
          else
            zig build-exe src/main.zig -lc -femit-bin=${{ matrix.binary }}
          fi
          zig test src/core/root.zig
          zig test src/core/queue.zig
          zig test src/protocols/http/download.zig
          python3 tests/integration/http_cli.py ${{ matrix.binary }}

      - name: Build native macOS GUI
        if: runner.os == 'macOS'
        run: bash macos/SpeedDownload/package-app.sh "dist/Speed Download.app"

      - name: Build native Linux GTK GUI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgtk-4-dev libjson-glib-dev
          cmake -S linux/SpeedDownload -B linux/SpeedDownload/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/SpeedDownload/build --parallel
          cmake --install linux/SpeedDownload/build --prefix "$GITHUB_WORKSPACE/linux/SpeedDownload/dist"

      - name: Retain native Linux GUI build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: speed-download-linux-gtk-${{ github.ref_name }}
          path: linux/SpeedDownload/dist/bin
          if-no-files-found: error

      - name: Set up .NET for WinUI
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native Windows WinUI GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet publish windows/SpeedDownload/SpeedDownload.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o windows/SpeedDownload/publish

      - name: Retain native Windows GUI build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: speed-download-windows-winui-${{ github.ref_name }}
          path: windows/SpeedDownload/publish
          if-no-files-found: error

      - name: Retain native macOS GUI build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: speed-download-macos-gui-${{ github.ref_name }}
          path: dist/Speed Download.app
          if-no-files-found: error

      - name: Retain native CLI build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
