name: Build tagged revision

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: zig-out/bin/odm
            artifact: odm-linux-x86_64
          - os: windows-latest
            binary: zig-out/bin/odm.exe
            artifact: odm-windows-x86_64
          - os: macos-latest
            binary: zig-out/bin/odm
            artifact: odm-macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build CLI and validate core
        shell: bash
        run: |
          mkdir -p zig-out/bin
          zig build-exe src/main.zig -femit-bin=${{ matrix.binary }}
          zig test src/core/root.zig
          zig test src/core/queue.zig
          zig test src/protocols/http/download.zig
          python3 tests/integration/http_cli.py ${{ matrix.binary }}

      - name: Retain native CLI build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
