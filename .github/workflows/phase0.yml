name: Phase 0 native and IPC feasibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_windows_gui:
        description: Run Windows desktop window, progress, and reconnect smoke
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native-platform:
    name: Native build and IPC smoke on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build native engine
        shell: bash
        run: |
          mkdir -p zig-out/bin
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            zig build-exe src/main.zig -femit-bin=zig-out/bin/speed-download.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            zig build-exe src/main.zig src/core/posix_stat_macos.c -lc -framework Security -femit-bin=zig-out/bin/speed-download
          else
            zig build-exe src/main.zig -lc -femit-bin=zig-out/bin/speed-download
          fi

      - name: Run native IPC, reconnect, progress, transfer, and recovery smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python tests/integration/ipc_engine.py zig-out/bin/speed-download.exe
          else
            python tests/integration/ipc_engine.py zig-out/bin/speed-download
          fi

      - name: Exercise exact multipart checkpoint boundary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python tests/integration/http_checkpoint.py zig-out/bin/speed-download.exe
          else
            python tests/integration/http_checkpoint.py zig-out/bin/speed-download
          fi

      - name: Smoke release-mode Windows HTTPS CLI
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            zig build-exe src/main.zig -target aarch64-windows -mcpu baseline -O ReleaseSafe -femit-bin=zig-out/bin/speed-download-release.exe
          else
            zig build-exe src/main.zig -target x86_64-windows -mcpu baseline -O ReleaseSafe -femit-bin=zig-out/bin/speed-download-release.exe
          fi
          zig-out/bin/speed-download-release.exe 'https://example.com/' "$RUNNER_TEMP/speed-download-https-smoke.html"
          test -s "$RUNNER_TEMP/speed-download-https-smoke.html"

      - name: Build native SwiftUI client
        if: runner.os == 'macOS'
        run: SPEED_DOWNLOAD_SKIP_REGISTER=1 bash macos/SpeedDownload/package-app.sh "dist/Speed Download.app"

      - name: Smoke Swift client connection and engine restart
        if: runner.os == 'macOS'
        run: bash tests/integration/macos_client.sh zig-out/bin/speed-download

      - name: Install GTK build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake pkg-config libgtk-4-dev libjson-glib-dev xvfb dbus-x11

      - name: Build native GTK client
        if: runner.os == 'Linux'
        run: |
          cmake -S linux/SpeedDownload -B linux/SpeedDownload/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/SpeedDownload/build --parallel

      - name: Smoke GTK client connection, progress, and engine restart
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python tests/integration/linux_client.py zig-out/bin/speed-download linux/SpeedDownload/build/speed-download-gtk

      - name: Set up .NET for WinUI
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native WinUI 3 client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            dotnet publish windows/SpeedDownload/SpeedDownload.csproj -c Release -r win-arm64 -p:Platform=ARM64 --self-contained true -o windows/SpeedDownload/publish
          } else {
            dotnet publish windows/SpeedDownload/SpeedDownload.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o windows/SpeedDownload/publish
          }
          if ($LASTEXITCODE -ne 0) { throw 'WinUI publish failed' }
          if (!(Test-Path windows/SpeedDownload/publish/SpeedDownload.pri)) { throw 'WinUI app resource index missing from publish output' }

      - name: Upload Windows client and engine
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpeedDownload-Windows-${{ runner.arch }}
          path: |
            windows/SpeedDownload/publish/
            tests/integration/ipc_engine.py
            tests/integration/windows_client.py
          if-no-files-found: error

      - name: Smoke Windows client connection, progress, and engine restart
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.verify_windows_gui == true)
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP 'speed-download-crash-dumps'
          New-Item -ItemType Directory -Force $dumpDir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\SpeedDownload.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumpDir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          python tests/integration/windows_client.py zig-out/bin/speed-download.exe windows/SpeedDownload/publish/SpeedDownload.exe

      - name: Report sanitized native WinUI crash identifiers
        if: failure() && runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.verify_windows_gui == true)
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP 'speed-download-crash-dumps'
          Start-Sleep -Seconds 3
          Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-5) } -MaxEvents 100 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SpeedDownload.exe' } |
            Select-Object -First 3 |
            ForEach-Object { $_.Message -split "`r?`n" | Where-Object { $_ -match '^(Faulting application name|Faulting module name|Exception code|Fault offset):' } }
          $debugger = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if ($debugger) {
            Get-ChildItem $dumpDir -Filter '*.dmp' | ForEach-Object {
              $analysis = & $debugger -z $_.FullName -c '.symfix; .reload; !analyze -v; q' 2>&1
              $analysis | Where-Object { $_ -match '^(EXCEPTION_CODE|MODULE_NAME|IMAGE_NAME|SYMBOL_NAME|FAILURE_BUCKET_ID|ExceptionAddress):?\s' }
            }
          } else {
            Write-Output 'cdb.exe is unavailable on this runner.'
          }
