name: Phase 0 native and IPC feasibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_windows_gui:
        description: Attempt WinUI window runtime smoke on the hosted Windows runners
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-platform:
    name: Native build and IPC smoke on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build native engine
        shell: bash
        run: |
          mkdir -p zig-out/bin
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            zig build-exe src/main.zig -femit-bin=zig-out/bin/speed-download.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            zig build-exe src/main.zig src/core/posix_stat_macos.c -lc -framework Security -femit-bin=zig-out/bin/speed-download
          else
            zig build-exe src/main.zig -lc -femit-bin=zig-out/bin/speed-download
          fi

      - name: Run native IPC, reconnect, progress, transfer, and recovery smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python tests/integration/ipc_engine.py zig-out/bin/speed-download.exe
          else
            python tests/integration/ipc_engine.py zig-out/bin/speed-download
          fi

      - name: Build native SwiftUI client
        if: runner.os == 'macOS'
        run: SPEED_DOWNLOAD_SKIP_REGISTER=1 bash macos/SpeedDownload/package-app.sh "dist/Speed Download.app"

      - name: Smoke Swift client connection and engine restart
        if: runner.os == 'macOS'
        run: bash tests/integration/macos_client.sh zig-out/bin/speed-download

      - name: Install GTK build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake pkg-config libgtk-4-dev libjson-glib-dev xvfb dbus-x11

      - name: Build native GTK client
        if: runner.os == 'Linux'
        run: |
          cmake -S linux/SpeedDownload -B linux/SpeedDownload/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/SpeedDownload/build --parallel

      - name: Smoke GTK client connection, progress, and engine restart
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python tests/integration/linux_client.py zig-out/bin/speed-download linux/SpeedDownload/build/speed-download-gtk

      - name: Set up .NET for WinUI
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native WinUI client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            dotnet publish windows/SpeedDownload/SpeedDownload.csproj -c Release -r win-arm64 -p:Platform=ARM64 --self-contained true -o windows/SpeedDownload/publish
          } else {
            dotnet publish windows/SpeedDownload/SpeedDownload.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o windows/SpeedDownload/publish
          }

      - name: Upload Windows client and engine
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpeedDownload-WinUI-${{ runner.arch }}
          path: |
            windows/SpeedDownload/publish/
            tests/integration/ipc_engine.py
            tests/integration/windows_client.py
          if-no-files-found: error

      - name: Smoke WinUI client connection, progress, and engine restart
        if: runner.os == 'Windows' && inputs.verify_windows_gui == true
        shell: pwsh
        run: python tests/integration/windows_client.py zig-out/bin/speed-download.exe windows/SpeedDownload/publish/SpeedDownload.exe
