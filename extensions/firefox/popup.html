<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Download</title>
  <style>
    :root { color-scheme: light dark; font: menu; }
    body { width: 260px; margin: 0; padding: 16px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    p { line-height: 1.4; margin: 0 0 12px; }
    #status { font-weight: 600; }
    .hint { color: GrayText; font-size: 12px; }
    button { font: inherit; padding: 5px 12px; }
  </style>
</head>
<body>
  <h1>Speed Download</h1>
  <p id="status" role="status" aria-live="polite">Checking connection…</p>
  <p class="hint">Right-click a link and choose Download with Speed Download.</p>
  <button id="refresh" type="button">Refresh</button>
  <script src="popup.js"></script>
</body>
</html>
